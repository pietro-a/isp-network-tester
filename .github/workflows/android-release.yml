name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format (for example, v1.2.3)." >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \\
            "platforms;android-36" \\
            "build-tools;36.0.0" \\
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?Missing ANDROID_RELEASE_STORE_PASSWORD secret}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?Missing ANDROID_RELEASE_KEY_ALIAS secret}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?Missing ANDROID_RELEASE_KEY_PASSWORD secret}"

          KEYSTORE_PATH="$RUNNER_TEMP/isp-network-tester-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          SIGNING_DIR="$HOME/.config/isp-network-tester"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          {
            printf 'storeFile=%s\\n' "$KEYSTORE_PATH"
            printf 'storePassword=%s\\n' "$ANDROID_RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\\n' "$ANDROID_RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\\n' "$ANDROID_RELEASE_KEY_PASSWORD"
          } > "$SIGNING_DIR/signing.properties"
          chmod 600 "$SIGNING_DIR/signing.properties"

      - name: Run tests, lint, and build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lint assembleRelease

      - name: Verify APK signature
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'isp-network-tester-*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
        id: apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/${{ steps.apk.outputs.apk }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \\
              --title "$GITHUB_REF_NAME" \\
              --generate-notes
          fi
