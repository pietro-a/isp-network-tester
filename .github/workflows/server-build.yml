name: ISP Network Tester server build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  server-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: server/go.mod

      - name: Test
        working-directory: server
        run: make test

      - name: Vet
        working-directory: server
        run: make vet

      - name: Build
        working-directory: server
        run: make build
